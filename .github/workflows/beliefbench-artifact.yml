# BeliefBench CI: smoke + regenerate + pytest (Ubuntu, uv).
name: beliefbench artifact

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Smoke test
        run: uv run python scripts/smoke_test.py

      - name: Regenerate runs + validate
        run: uv run python scripts/regenerate.py

      - name: Pytest
        run: uv run pytest
